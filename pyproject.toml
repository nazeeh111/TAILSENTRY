[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailsentry"
version = "0.1.0"
description = "Inspectable rare-event estimation with projection-conditioned mixtures"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14"]

[project.optional-dependencies]
research = ["matplotlib>=3.9", "pytest>=8"]

[project.scripts]
tailsentry = "tailsentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tailsentry = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
